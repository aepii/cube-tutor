# Every push to master: build the backend image ONCE, push it to GHCR as :<sha>,
# then deploy that exact digest to `dev`. Releases later promote the same digest
# (deploy-prod.yml); nothing is rebuilt. See docs/ci-cd.md.
# No wait on ci.yml: the master ruleset only lets a PR merge once `ci-ok` passed.
name: Deploy dev

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  # Never cancel a half-finished deploy; queue the next one instead.
  cancel-in-progress: false

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io; only this job gets it
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image name
        id: name
        # GHCR repository names must be lower case.
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cubetutor-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.repo }}:${{ github.sha }}
          # `source` links the GHCR package to this repo (and its Actions access).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: digest reference
        id: ref
        env:
          REPO: ${{ steps.name.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $REPO:$GITHUB_SHA = $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: image
    # A called workflow can't exceed its caller's permissions: grant the OIDC
    # token here so deploy.yml's job can log in to Azure.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
