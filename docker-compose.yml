# One image (backend/Dockerfile) runs three ways: `migrate` (one-shot: migrations
# + seed), `backend` (uvicorn) and `celery` (worker). See ADR 0005.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: cubetutor-backend
  init: true
  environment:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: ${POSTGRES_HOST}
    DATABASE_URL: ${DATABASE_URL}
    SECRET_KEY: ${SECRET_KEY}
    # App settings (docs/backend.md#configuration). The fallbacks are dev values,
    # so an older .env without these lines still works.
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:8080}
    SQL_ECHO: ${SQL_ECHO:-false}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}

services:
  # Runs once per `up`; backend and celery start only if it exits 0.
  migrate:
    <<: *app
    container_name: cubetutor_migrate
    restart: "no"
    command: sh -c "alembic upgrade head && python -m seed.seed_algorithms"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    container_name: cubetutor_backend
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    # Dev only: live code + reload. The image's CMD is plain uvicorn (UVICORN_* env).
    # The venv (/opt/venv) and seed data (/shared) live outside /app, so the mount doesn't hide them.
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --reload-dir app
    # Readiness = the API answers and reaches Postgres. The slim image has no curl;
    # urlopen raises on a 503 or a refused connection, so the check exits non-zero.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: postgres:18
    container_name: cubetutor_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 60s
      retries: 5
      start_period: 5s
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.4
    container_name: cubetutor_redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT}:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: cubetutor_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  celery:
    <<: *app
    container_name: cubetutor_celery
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres_data:
  pgadmin_data:
