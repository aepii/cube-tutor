# Tool config only. Packaging (one package for backend + worker) is ROADMAP 4c.

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." puts the repo root on sys.path so `shared` imports, like the Docker bind mount.
pythonpath = [".", ".."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The migration template always imports sqlmodel (for AutoString), used or not.
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "seed", "shared"]
# The local alembic/ folder (migration scripts) would otherwise make it first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
