# One package for the API, migrations and the seed (ADR 0005).
# No [build-system]: uv installs the dependencies only, the code runs from source.
# Add dependencies with `uv add <pkg>` / `uv add --dev <pkg>`; commit uv.lock.

[project]
name = "cubetutor-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.1",
    # passlib 1.7.4 breaks on bcrypt 5 (its startup self-test hashes a >72-byte password).
    "bcrypt>=4.3.0,<5",
    "fastapi>=0.128.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    # SQLAlchemy 2.1 makes psycopg 3 the default driver for postgresql:// URLs; we use psycopg2.
    "sqlalchemy>=2.0.45,<2.1",
    # Newer sqlmodel maps datetime to UTCDateTime, a schema change that needs its own migration.
    "sqlmodel>=0.0.31,<0.0.32",
    "uvicorn[standard]>=0.54.0",
    "azure-monitor-opentelemetry>=1.8.12",
    "opentelemetry-instrumentation>=0.66b2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",  # fastapi.testclient
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The migration template always imports sqlmodel (for AutoString), used or not.
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "seed"]
# The local alembic/ folder (migration scripts) would otherwise make it first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
