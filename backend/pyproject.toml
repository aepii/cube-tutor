# Tool config only. Packaging (one package for backend + worker) is ROADMAP 4c.

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." puts the repo root on sys.path so `shared` imports, like the Docker bind mount.
pythonpath = [".", ".."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
# alembic/versions is replaced by one autogenerated baseline in 4b.
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "seed", "shared"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
